{% load crispy_forms_tags %}

<div class="modal fade" id="bookingModal{{ movie.id }}" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="bookingModalLabel">Đặt Vé Xem Phim</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true" class="text-white">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <!-- Biểu đồ chỗ ngồi -->
        <div class="seat-chart">
          <div class="screen"></div>
          <div class="row m-3 seats" id="seat-buttons{{ movie.id }}"></div>

          <ul class="showcase">
            <li><div class="case"></div><small>Ghế trống</small></li>
            <li><div class="case selected"></div><small>Đã chọn</small></li>
            <li><div class="case occupied"></div><small>Đã được đặt</small></li>
          </ul>
        </div>

        <!-- Form đặt vé -->
        <form id="bookingForm{{ movie.id }}" method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label>Phim:</label>
            <input type="text" class="form-control" value="{{ movie.title }}" disabled>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6 mb-0" id="roomSelection{{ movie.id }}">
              {{ form.room|as_crispy_field }}
            </div>
            <div class="form-group col-md-6 mb-0">
              {{ form.date_time|as_crispy_field }}
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6 mb-0" id="typeSelection{{ movie.id }}">
              {{ form.type|as_crispy_field }}
            </div>
            <div class="form-group col-md-6 mb-0">
              <label>Giá vé:</label>
              <input type="text" class="form-control" id="price{{ movie.id }}" value="" disabled>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6 mb-0" id="quantitySelection{{ movie.id }}">
              <label>Số lượng vé:</label>
              <input type="number" class="form-control" name="quantity{{ movie.id }}" value="1" min="1" max="99">
            </div>
            <div class="form-group col-md-6 mb-0">
              <label>Tổng tiền:</label>
              <input type="text" class="form-control" id="totalPrice{{ movie.id }}" value="" disabled>
            </div>
          </div>

          <div class="form-row mt-2">
            <button type="submit" class="btn btn-primary m-2" id="bookingButton{{ movie.id }}">Đặt vé</button>
            <button type="button" class="btn btn-secondary m-2" data-dismiss="modal">Hủy</button>
          </div>
        </form>
      </div>

      <div class="modal-footer" style="justify-content:center;">
        <div id="bookingError{{ movie.id }}"></div>
      </div>
    </div>
  </div>
</div>

<!-- ================== JavaScript xử lý ================== -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
$(function () {
  const movieId  = "{{ movie.id }}";
  const $form    = $("#bookingForm{{ movie.id }}");
  const $roomSel = $("#roomSelection{{ movie.id }} select");
  const $dtInput = $form.find("input[name='date_time']");
  const $seatBox = $("#seat-buttons{{ movie.id }}");
  const apiSeatsUrl = "{% url 'api_seats' %}";

  // ======= Hiển thị danh sách ghế trống =======
  function renderSeats(items) {
    if (!items || !items.length) {
      $seatBox.html('<div class="text-muted">Không còn ghế trống cho suất này.</div>');
      return;
    }
    let html = "";
    items.forEach(s => {
      html += `<div class="seat" data-seat-id="${s.id}">${s.seat_number}</div>`;
    });
    $seatBox.html(html);
  }

  // ======= Tải danh sách ghế =======
  function loadSeats() {
    const roomId = $roomSel.val();
    let dt = $dtInput.val();
    if (!roomId || !dt) { $seatBox.empty(); return; }

    if (dt.includes('T')) dt = dt.replace('T', ' ');
    $.getJSON(apiSeatsUrl, { movie_id: movieId, room_id: roomId, date_time: dt })
      .done(res => renderSeats(res.available || []))
      .fail(xhr => {
        console.error("api_seats fail:", xhr.status, xhr.responseText);
        $seatBox.html('<div class="text-danger">Lỗi tải ghế.</div>');
      });
  }

  $roomSel.on("change", loadSeats);
  $dtInput.on("change", loadSeats);

  // ======= Tính giá vé và tổng tiền =======
  $("#typeSelection{{ movie.id }}").on("change", "select", function() {
    const type = $(this).val();
    const price = (type === 'Adult') ? 100000 : 50000;
    $("#price{{ movie.id }}").val(price.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' }));

    const quantity = parseInt($("input[name='quantity{{ movie.id }}']").val() || 0, 10);
    const total = price * quantity;
    $("#totalPrice{{ movie.id }}").val(total.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' }));
  });

  $("input[name='quantity{{ movie.id }}']").on("change input", function() {
    const type = $("#typeSelection{{ movie.id }} select").val();
    const price = (type === 'Adult') ? 100000 : 50000;
    const quantity = parseInt($(this).val() || 0, 10);
    const total = quantity * price;
    $("#totalPrice{{ movie.id }}").val(total.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' }));
  });

  // ======= Chọn ghế (giới hạn theo số lượng) =======
  $seatBox.on("click", ".seat", function() {
    const $this = $(this);
    const quantity = parseInt($("input[name='quantity{{ movie.id }}']").val() || 0, 10);
    const selected = $seatBox.find(".seat.selected");
    if ($this.hasClass("selected")) {
      $this.removeClass("selected");
    } else {
      if (selected.length >= quantity) {
        alert("Số lượng vé không đủ!");
        return;
      }
      $this.addClass("selected");
    }
  });

  // ======= Gửi AJAX đặt vé =======
  $form.on("submit", function(e) {
    e.preventDefault();

    const csrftoken = $form.find("[name=csrfmiddlewaretoken]").val();
    const roomId    = $roomSel.val();
    let date_time   = $dtInput.val();
    const type      = $("#typeSelection{{ movie.id }} select").val();
    const quantity  = parseInt($("input[name='quantity{{ movie.id }}']").val() || 0, 10);
    if (date_time && date_time.includes('T')) date_time = date_time.replace('T', ' ');

    const selectedSeatIds = $seatBox.find(".seat.selected").map(function(){ return $(this).data("seat-id"); }).get();

    if (!roomId || !date_time) {
      $("#bookingError{{ movie.id }}").html('<p class="text-danger">Vui lòng chọn phòng và thời gian!</p>');
      return;
    }
    if (!selectedSeatIds.length || selectedSeatIds.length < quantity) {
      $("#bookingError{{ movie.id }}").html('<p class="text-danger">Vui lòng chọn đủ số lượng ghế!</p>');
      return;
    }

    const payload = {
      csrfmiddlewaretoken: csrftoken,
      room_id: roomId,
      movie_id: movieId,
      date_time: date_time,
      type: type,
      quantity: quantity
    };
    payload["selected_seats[]"] = selectedSeatIds;

    $.ajax({
      url: "{% url 'user_booking' %}",
      type: "POST",
      data: payload,
      dataType: "json",
      traditional: true,
      success: function(data) {
        if (data && data.status === "success") {
          $("#bookingError{{ movie.id }}").html('<p class="text-success">Đặt vé thành công! Sẽ chuyển hướng sau 3 giây...</p>');
          setTimeout(() => window.location.href = '/trang-chu/', 2500);
        } else {
          $("#bookingError{{ movie.id }}").html('<p class="text-danger">Đặt vé thất bại! ' + (data && data.message ? data.message : 'Vui lòng thử lại.') + '</p>');
        }
      },
      error: function(xhr) {
        let msg = 'Lỗi máy chủ (' + xhr.status + ').';
        try { msg += ' ' + (JSON.parse(xhr.responseText).message || ''); } catch(e){}
        console.error("user_booking error:", xhr.status, xhr.responseText);
        $("#bookingError{{ movie.id }}").html('<p class="text-danger">'+msg+'</p>');
      }
    });
  });
});
</script>
